site_name: PixelScope User Guide
site_description: Searchable user documentation for PixelScope image comparison and analysis workflows.
docs_dir: docs/user-guide
site_dir: site
use_directory_urls: false
exclude_docs: |
  assets/screenshots/README.md

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

# The Material offline plugin honors an existing iframe-worker polyfill.
# Pin its extension-bearing URL: privacy downloads it as a regular .js file,
# avoiding the extensionless CDN alias that requires symlinks on Windows.
extra:
  polyfills:
    - https://unpkg.com/iframe-worker@1.0.4/shim/index.js

plugins:
  - search
  - offline
  - privacy

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quick-start.md
      - Core concepts: getting-started/concepts.md
  - Workflows:
      - Open images: workflows/open-images.md
      - Open folders: workflows/open-folders.md
      - Compare images: workflows/compare-images.md
      - Compare more than six images: workflows/compare-many-images.md
      - Curate a large selection: workflows/curate-selection.md
      - Compare folder positions: workflows/compare-folder-positions.md
      - Inspect an ROI: workflows/inspect-roi.md
      - Inspect a histogram: workflows/inspect-histogram.md
      - Inspect a line profile: workflows/inspect-line-profile.md
      - Use Difference: workflows/use-difference.md
      - Export analysis: workflows/export-analysis.md
      - Save and restore work: workflows/save-and-restore-work.md
      - Use Remote IQA: workflows/use-remote-iqa.md
  - Features:
      - Files workspace: features/files-workspace.md
      - Image View: features/image-view.md
      - Statistics: features/statistics.md
      - Histogram: features/histogram.md
      - Line Profile: features/line-profile.md
      - Difference: features/difference.md
      - Plots workspace: features/plots-workspace.md
      - IQA workspace: features/iqa-workspace.md
      - Settings: features/settings.md
      - Runtime diagnostics: features/runtime-diagnostics.md
  - Formats:
      - Standard images: formats/standard-images.md
      - RAW: formats/raw.md
      - YUV: formats/yuv.md
  - Reference:
      - Keyboard shortcuts: reference/keyboard-shortcuts.md
      - Supported formats: reference/supported-formats.md
      - Settings reference: reference/settings.md
      - Terminology: reference/terminology.md
  - Troubleshooting: troubleshooting/index.md
