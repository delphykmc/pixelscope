[build-system]
requires = ["setuptools==69.0.3", "wheel==0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelscope"
version = "0.1.0"
description = "CPU-only Windows image inspection and comparison MVP"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy==1.24.4",
    "opencv-python==4.8.1.78",
    "pydantic==1.10.13",
    "httpx==0.24.1",
    "PySide6==6.4.2",
    "pyqtgraph==0.13.3",
]

[project.scripts]
pixelscope = "pixelscope.app.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cv2", "pyqtgraph", "pyqtgraph.*"]
ignore_missing_imports = true
