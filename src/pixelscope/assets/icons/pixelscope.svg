<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">PixelScope application icon</title>
  <desc id="desc">A blue-gray image frame crossed by streamlined motion lines and inspected through a magnifying scope containing a four-pixel grid with one amber accent.</desc>
  <defs>
    <linearGradient id="bg" x1="76" y1="50" x2="438" y2="466" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#31445f"/>
      <stop offset="0.5" stop-color="#202f45"/>
      <stop offset="1" stop-color="#111a28"/>
    </linearGradient>
    <linearGradient id="frame" x1="128" y1="100" x2="392" y2="376" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5f8fc"/>
      <stop offset="0.52" stop-color="#cbd5e2"/>
      <stop offset="1" stop-color="#8798af"/>
    </linearGradient>
    <linearGradient id="mountainBack" x1="198" y1="174" x2="372" y2="328" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#739edf"/>
      <stop offset="1" stop-color="#315f9f"/>
    </linearGradient>
    <linearGradient id="mountainFront" x1="136" y1="226" x2="272" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5e93d7"/>
      <stop offset="1" stop-color="#274f88"/>
    </linearGradient>
    <linearGradient id="speedBlue" x1="58" y1="0" x2="188" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4d6f9e" stop-opacity="0.18"/>
      <stop offset="0.42" stop-color="#5e8fd1"/>
      <stop offset="1" stop-color="#77bdff"/>
    </linearGradient>
    <linearGradient id="speedAmber" x1="58" y1="0" x2="188" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5b63b" stop-opacity="0.08"/>
      <stop offset="0.42" stop-color="#f5b63b"/>
      <stop offset="1" stop-color="#ffd064"/>
    </linearGradient>
    <linearGradient id="ring" x1="236" y1="218" x2="394" y2="388" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.56" stop-color="#c9d4e1"/>
      <stop offset="1" stop-color="#8496ad"/>
    </linearGradient>
    <linearGradient id="handle" x1="370" y1="370" x2="454" y2="454" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#315f9f"/>
      <stop offset="1" stop-color="#1d3a68"/>
    </linearGradient>
    <linearGradient id="pixelBlue" x1="280" y1="266" x2="352" y2="338" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#71bcff"/>
      <stop offset="1" stop-color="#3278d1"/>
    </linearGradient>
    <linearGradient id="pixelAmber" x1="324" y1="310" x2="358" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd064"/>
      <stop offset="1" stop-color="#f2a92e"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#050a12" flood-opacity="0.45"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#050a12" flood-opacity="0.38"/>
    </filter>
    <clipPath id="sceneClip">
      <rect x="128" y="108" width="264" height="268" rx="40"/>
    </clipPath>
  </defs>

  <!-- Transparent outer corners make the mark suitable for Windows and Qt icons. -->
  <rect x="24" y="24" width="464" height="464" rx="94" fill="url(#bg)" stroke="#627691" stroke-width="3"/>

  <!-- Streamlined speed marks: broad, continuous strokes rather than fragmented dashes. -->
  <g fill="none" stroke-linecap="round">
    <path d="M58 226 H181" stroke="url(#speedAmber)" stroke-width="15"/>
    <path d="M58 272 H167" stroke="url(#speedBlue)" stroke-width="14"/>
    <path d="M58 318 H148" stroke="url(#speedBlue)" stroke-width="12" opacity="0.78"/>
  </g>

  <!-- Image-analysis frame and simplified scene. -->
  <g clip-path="url(#sceneClip)">
    <circle cx="194" cy="174" r="24" fill="#91b7eb"/>
    <path d="M182 322 L255 236 Q262 228 270 237 L340 314 Z" fill="url(#mountainFront)"/>
    <path d="M218 326 L326 186 Q333 176 342 186 L407 270 L407 326 Z" fill="url(#mountainBack)"/>
  </g>
  <rect x="128" y="108" width="264" height="268" rx="40" fill="none" stroke="url(#frame)" stroke-width="27"/>

  <!-- Magnifying scope, intentionally dominant at small icon sizes. -->
  <g filter="url(#shadow)">
    <path d="M374 367 L446 439" stroke="#a8b7c9" stroke-width="38" stroke-linecap="round"/>
    <path d="M382 375 L446 439" stroke="url(#handle)" stroke-width="30" stroke-linecap="round"/>
    <circle cx="312" cy="300" r="104" fill="#121f31" stroke="#0a111d" stroke-width="11"/>
    <circle cx="312" cy="300" r="96" fill="#172840" stroke="url(#ring)" stroke-width="25"/>
  </g>

  <!-- Pixel grid: four large cells survive 16 px rendering; amber preserves CAT-family lineage. -->
  <g filter="url(#softShadow)">
    <rect x="273" y="261" width="34" height="34" rx="4" fill="url(#pixelBlue)" stroke="#9ed0ff" stroke-width="2"/>
    <rect x="317" y="261" width="34" height="34" rx="4" fill="url(#pixelBlue)" stroke="#9ed0ff" stroke-width="2"/>
    <rect x="273" y="305" width="34" height="34" rx="4" fill="url(#pixelBlue)" stroke="#8fc3f5" stroke-width="2"/>
    <rect x="317" y="305" width="34" height="34" rx="4" fill="url(#pixelAmber)" stroke="#ffdc7e" stroke-width="2"/>
  </g>

  <!-- Four coarse scope ticks reinforce precision without relying on fine detail. -->
  <g fill="none" stroke="#eef3f9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M263 272 V251 H284"/>
    <path d="M340 251 H361 V272"/>
    <path d="M263 328 V349 H284"/>
    <path d="M340 349 H361 V328"/>
  </g>
</svg>
