name: RAW input validation

on:
  pull_request:
    paths:
      - "src/pixelscope/io/raw_format.py"
      - "src/pixelscope/io/raw_profile.py"
      - "src/pixelscope/io/raw_reader.py"
      - "src/pixelscope/ui/raw_open_dialog.py"
      - "tests/unit/test_packed_raw_stream.py"
      - "tests/unit/test_raw_reader.py"
      - "tests/unit/test_wp_b_raw_profile_compatibility.py"
      - "tests/ui/test_p1c_raw_dialog.py"
      - "tests/ui/test_wp_b_raw_binary_compatibility.py"
      - ".github/workflows/raw-input.yml"
  push:
    branches: [main]
    paths:
      - "src/pixelscope/io/raw_format.py"
      - "src/pixelscope/io/raw_profile.py"
      - "src/pixelscope/io/raw_reader.py"
      - "src/pixelscope/ui/raw_open_dialog.py"
      - "tests/unit/test_packed_raw_stream.py"
      - "tests/unit/test_raw_reader.py"
      - "tests/unit/test_wp_b_raw_profile_compatibility.py"
      - "tests/ui/test_p1c_raw_dialog.py"
      - "tests/ui/test_wp_b_raw_binary_compatibility.py"
      - ".github/workflows/raw-input.yml"

permissions:
  contents: read

concurrency:
  group: raw-input-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install application and pinned validation tools
        run: >-
          python -m pip install -e .
          pytest==7.4.4 pytest-qt==4.2.0 ruff==0.1.15 mypy==1.8.0
      - name: Check installed environment
        run: python -m pip check
      - name: Run focused RAW contract slice
        run: >-
          python -m pytest -q
          tests/unit/test_packed_raw_stream.py
          tests/unit/test_raw_reader.py
          tests/unit/test_wp_b_raw_profile_compatibility.py::test_minimum_stride_uses_storage_specific_row_layout
          tests/ui/test_p1c_raw_dialog.py::test_raw_dialog_separates_storage_format_container_and_bit_depth
          tests/ui/test_p1c_raw_dialog.py::test_raw_dialog_packed_stream_supports_variable_depth_and_bit_order
          tests/ui/test_p1c_raw_dialog.py::test_raw_dialog_packed_formats_hide_non_applicable_rows
          tests/ui/test_wp_b_raw_binary_compatibility.py::test_raw_dialog_tracks_minimum_stride_until_manual_override
      - name: Check lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type-check source
        run: python -m mypy src
      - name: Run full repository suite
        if: github.event_name == 'pull_request'
        run: python -m pytest -q
      - name: Check diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
