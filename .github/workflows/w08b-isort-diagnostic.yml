name: W08b temporary isort diagnostic

on:
  pull_request:
    paths:
      - "src/pixelscope/io/input_profile_batch.py"
      - ".github/workflows/w08b-isort-diagnostic.yml"

permissions:
  contents: read

jobs:
  show-isort-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install ruff==0.1.15
      - name: Print exact pinned isort proposed fix
        run: |
          sed -i 's/  # noqa: I001//' src/pixelscope/io/input_profile_batch.py
          python -m ruff check --select I --fix --diff src/pixelscope/io/input_profile_batch.py || true
