name: Issue 121 Slice 4 patch

on:
  push:
    branches:
      - feat/issue-121-slice-4-iqa-composition-seam

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-121-slice-4-iqa-composition-seam
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Format Slice 4 canary
        run: |
          python -m pip install ruff==0.1.15
          python -m ruff format tests/ui/test_issue121_iqa_composition_seam.py
      - name: Commit formatter result when needed
        shell: bash
        run: |
          if git diff --quiet -- tests/ui/test_issue121_iqa_composition_seam.py; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/test_issue121_iqa_composition_seam.py
          git commit -m "[ChatGPT-assisted] Apply Slice 4 Ruff formatting" -m "Co-authored-by: ChatGPT <noreply@openai.com>"
          git push origin HEAD:feat/issue-121-slice-4-iqa-composition-seam
