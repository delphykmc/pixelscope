name: Issue 121 Slice 4 patch

on:
  push:
    branches:
      - feat/issue-121-slice-4-iqa-composition-seam

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-121-slice-4-iqa-composition-seam
      - name: Apply narrow composition refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'anchor not found: {label}')
              return text.replace(old, new, 1)

          path = Path('src/pixelscope/app/main_window.py')
          text = path.read_text(encoding='utf-8')
          text = replace(
              text,
              'from pixelscope.app.settings import ApplicationSettings, SettingsRepository\n',
              'from pixelscope.app.settings import ApplicationSettings, SettingsRepository\n'
              'from pixelscope.app.window_contribution import WindowContribution\n',
              'main window contribution import',
          )
          text = replace(
              text,
              'from pixelscope.ui.iqa_workspace import IqaWorkspaceController, IqaWorkspaceWidget\n',
              '',
              'remove direct IQA workspace import',
          )
          text = replace(
              text,
              '        *,\n        iqa_result_pool: QThreadPool | None = None,\n    ) -> None:\n',
              '        *,\n        iqa_result_pool: QThreadPool | None = None,\n'
              '        window_contributions: Sequence[WindowContribution] | None = None,\n'
              '    ) -> None:\n',
              'constructor contribution argument',
          )
          text = replace(
              text,
              '        self.analysis_tabs.addTab(self.comparison_analysis_panel, "Statistics")\n'
              '        self.analysis_tabs.addTab(self.difference_panel, "Difference")\n'
              '        self.iqa_workspace = IqaWorkspaceWidget()\n'
              '        self.iqa_controller = IqaWorkspaceController(\n'
              '            self.iqa_workspace,\n'
              '            self,\n'
              '            pool=iqa_result_pool,\n'
              '        )\n'
              '        self._build_layout()\n',
              '        self.analysis_tabs.addTab(self.comparison_analysis_panel, "Statistics")\n'
              '        self.analysis_tabs.addTab(self.difference_panel, "Difference")\n'
              '        self._contributed_docks: list[QDockWidget] = []\n'
              '        self._window_contributions = (\n'
              '            tuple(window_contributions)\n'
              '            if window_contributions is not None\n'
              '            else self._legacy_window_contributions(iqa_result_pool)\n'
              '        )\n'
              '        for contribution in self._window_contributions:\n'
              '            contribution.prepare(self)\n'
              '        self._build_layout()\n'
              '        for contribution in self._window_contributions:\n'
              '            contribution.install_dock(self)\n',
              'move IQA construction behind contribution',
          )
          text = replace(
              text,
              '        self.addDockWidget(Qt.DockWidgetArea.BottomDockWidgetArea, self.bottom_dock)\n\n'
              '        self.iqa_dock = QDockWidget("IQA", self)\n'
              '        self.iqa_dock.setObjectName("iqaWorkspaceDock")\n'
              '        self.iqa_dock.setWidget(self.iqa_workspace)\n'
              '        self.iqa_dock.setAllowedAreas(\n'
              '            Qt.DockWidgetArea.LeftDockWidgetArea | Qt.DockWidgetArea.RightDockWidgetArea\n'
              '        )\n'
              '        self.iqa_dock.setFeatures(\n'
              '            QDockWidget.DockWidgetFeature.DockWidgetClosable\n'
              '            | QDockWidget.DockWidgetFeature.DockWidgetMovable\n'
              '            | QDockWidget.DockWidgetFeature.DockWidgetFloatable\n'
              '        )\n'
              '        self.addDockWidget(Qt.DockWidgetArea.RightDockWidgetArea, self.iqa_dock)\n'
              '        self.iqa_dock.hide()\n\n'
              '    def _create_actions(self) -> None:\n',
              '        self.addDockWidget(Qt.DockWidgetArea.BottomDockWidgetArea, self.bottom_dock)\n\n'
              '    def register_contributed_dock(self, dock: QDockWidget) -> None:\n'
              '        """Register a contribution-owned dock for Base persistence/shutdown handling."""\n\n'
              '        if dock not in self._contributed_docks:\n'
              '            self._contributed_docks.append(dock)\n\n'
              '    @staticmethod\n'
              '    def _legacy_window_contributions(\n'
              '        iqa_result_pool: QThreadPool | None,\n'
              '    ) -> tuple[WindowContribution, ...]:\n'
              '        """Temporary Stage-1 shim preserving direct MainWindow() IQA test setup.\n\n'
              '        Production injects the IQA Client explicitly from application.py. This\n'
              '        compatibility path is intentionally local and can disappear after the first\n'
              '        SUB handoff without changing the generic contribution seam.\n'
              '        """\n\n'
              '        from pixelscope.ui.iqa_client_install import IqaClientInstaller\n\n'
              '        return (IqaClientInstaller(iqa_result_pool),)\n\n'
              '    def _create_actions(self) -> None:\n',
              'remove IQA dock from Base',
          )
          text = replace(
              text,
              '        add_action("File", "Open Images...", self.open_images, "Ctrl+O")\n'
              '        add_action("File", "Open Folder...", self.open_folders, "Ctrl+Shift+O")\n'
              '        add_action("File", "Open IQA Result...", self.open_iqa_result)\n'
              '        menus["File"].addSeparator()\n',
              '        add_action("File", "Open Images...", self.open_images, "Ctrl+O")\n'
              '        add_action("File", "Open Folder...", self.open_folders, "Ctrl+Shift+O")\n'
              '        for contribution in self._window_contributions:\n'
              '            contribution.install_actions(self, "File", add_action)\n'
              '        menus["File"].addSeparator()\n',
              'file contribution actions',
          )
          text = replace(
              text,
              '        self.redock_plots_action.setStatusTip(self.redock_plots_action.toolTip())\n'
              '        self.redock_plots_action.setEnabled(False)\n'
              '        self.iqa_workspace_action = add_action("View", "Show IQA Workspace", self._toggle_iqa)\n'
              '        self.iqa_workspace_action.setCheckable(True)\n'
              '        self.iqa_dock.visibilityChanged.connect(  # type: ignore[attr-defined]\n'
              '            self.iqa_workspace_action.setChecked\n'
              '        )\n'
              '        add_action("View", "Reset Workspace Layout", self.reset_workspace_layout)\n',
              '        self.redock_plots_action.setStatusTip(self.redock_plots_action.toolTip())\n'
              '        self.redock_plots_action.setEnabled(False)\n'
              '        for contribution in self._window_contributions:\n'
              '            contribution.install_actions(self, "View", add_action)\n'
              '        add_action("View", "Reset Workspace Layout", self.reset_workspace_layout)\n',
              'view contribution actions',
          )
          text = replace(
              text,
              '    def _toggle_iqa(self) -> None:\n'
              '        self.iqa_dock.setVisible(self.iqa_workspace_action.isChecked())\n'
              '        if self.iqa_workspace_action.isChecked():\n'
              '            self.iqa_dock.raise_()\n\n',
              '',
              'remove IQA toggle from Base',
          )
          text = replace(
              text,
              '    def open_iqa_result(self) -> None:\n'
              '        root = QFileDialog.getExistingDirectory(\n'
              '            self,\n'
              '            "Open IQA Result",\n'
              '            self._open_dialog_directory(),\n'
              '        )\n'
              '        if not root:\n'
              '            return\n'
              '        self.iqa_dock.show()\n'
              '        self.iqa_dock.raise_()\n'
              '        self.iqa_controller.open_result(Path(root))\n'
              '        self.statusBar().showMessage(f"Opening IQA result · {Path(root).name}")\n\n',
              '',
              'remove IQA open from Base',
          )
          text = replace(
              text,
              '        for dock in (self.bottom_dock, self.iqa_dock):\n',
              '        for dock in (self.bottom_dock, *self._contributed_docks):\n',
              'generic floating dock shutdown',
          )
          text = replace(
              text,
              '        self.bottom_dock.hide()\n        self.iqa_dock.hide()\n        self.set_layout_mode("Auto")\n',
              '        self.bottom_dock.hide()\n'
              '        for dock in self._contributed_docks:\n'
              '            dock.hide()\n'
              '        self.set_layout_mode("Auto")\n',
              'generic reset contributed docks',
          )
          text = replace(
              text,
              '        self.difference_panel.shutdown()\n        self.iqa_controller.shutdown()\n',
              '        self.difference_panel.shutdown()\n'
              '        for contribution in self._window_contributions:\n'
              '            contribution.shutdown()\n',
              'generic contribution shutdown',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('src/pixelscope/ui/iqa_client_install.py')
          text = path.read_text(encoding='utf-8')
          text = replace(
              text,
              'from pixelscope.remote.iqa_transport_pool import ReusableIqaClientPool\n',
              'from pixelscope.remote.iqa_transport_pool import ReusableIqaClientPool\n'
              'from pixelscope.workers.iqa_thread_pool import remote_iqa_thread_pool\n',
              'production pool import',
          )
          text = replace(
              text,
              '    @property\n    def result_pool(self) -> QThreadPool:\n',
              '    @classmethod\n'
              '    def production(cls) -> "IqaClientInstaller":\n'
              '        """Create the production client after Base local-pool initialization."""\n\n'
              '        return cls(remote_iqa_thread_pool())\n\n'
              '    @property\n'
              '    def result_pool(self) -> QThreadPool:\n',
              'production factory',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('src/pixelscope/app/application.py')
          text = path.read_text(encoding='utf-8')
          for old in [
              'from PySide6.QtCore import QSettings, QThreadPool\n',
              'from pixelscope.remote.iqa_transport_pool import ReusableIqaClientPool\n',
              '    install_remote_iqa,\n',
              'from pixelscope.ui.iqa_historical_results import install_historical_iqa_results\n',
              'from pixelscope.ui.iqa_historical_results_lifecycle import (\n    install_historical_iqa_results_lifecycle,\n)\n',
              'from pixelscope.ui.iqa_p5f_diagnostics import install_remote_iqa_diagnostics\n',
              'from pixelscope.ui.iqa_p5f_lifecycle import install_remote_iqa_transport_lifecycle\n',
              'from pixelscope.ui.iqa_preview_lifecycle import install_remote_iqa_preview_lifecycle\n',
              'from pixelscope.ui.iqa_replay_debug import install_remote_iqa_replay_debug\n',
              'from pixelscope.ui.iqa_request_debug import install_remote_iqa_request_debug\n',
              'from pixelscope.ui.iqa_result_mapping import install_remote_iqa_result_mapping\n',
              'from pixelscope.ui.iqa_result_retry import install_remote_iqa_result_retry\n',
              'from pixelscope.ui.iqa_scene_inspection import install_iqa_scene_inspection\n',
              'from pixelscope.ui.iqa_scene_inspection_lifecycle import install_iqa_scene_inspection_lifecycle\n',
              'from pixelscope.ui.iqa_setup_presentation import polish_remote_iqa_setup\n',
              'from pixelscope.ui.iqa_submission_lifecycle import install_remote_iqa_submission_lifecycle\n',
              'from pixelscope.workers.iqa_thread_pool import remote_iqa_thread_pool\n',
          ]:
              if old not in text:
                  raise SystemExit(f'application import anchor missing: {old!r}')
              text = text.replace(old, '', 1)
          text = text.replace(
              'from PySide6.QtWidgets import QApplication, QComboBox\n',
              'from PySide6.QtCore import QSettings\n'
              'from PySide6.QtWidgets import QApplication, QComboBox\n',
              1,
          )
          text = replace(
              text,
              'from pixelscope.ui.issue77_ui_design_followup import install_issue77_ui_design_followup\n',
              'from pixelscope.ui.iqa_client_install import IqaClientInstaller\n'
              'from pixelscope.ui.issue77_ui_design_followup import install_issue77_ui_design_followup\n',
              'client installer import',
          )
          text = replace(
              text,
              'def _compose_main_window_presentation(window: MainWindow) -> QComboBox:\n',
              'def _compose_main_window_presentation(\n'
              '    window: MainWindow,\n'
              '    iqa_client: IqaClientInstaller,\n'
              ') -> QComboBox:\n',
              'presentation signature',
          )
          text = replace(
              text,
              '    # Production injects the P5-F result/file pool when constructing MainWindow.\n'
              '    # The same dependency is forwarded to later result-side controllers here.\n'
              '    result_pool = window.iqa_controller.pool\n'
              '    transport_pool = ReusableIqaClientPool()\n'
              '    _compose_remote_iqa(\n'
              '        window,\n'
              '        result_pool=result_pool,\n'
              '        transport_pool=transport_pool,\n'
              '    )\n',
              '    iqa_client.install_runtime(window)\n',
              'runtime installer call',
          )
          start = text.index('\ndef _compose_remote_iqa(')
          end = text.index('\ndef main(', start)
          text = text[:start] + '\n' + text[end:]
          text = replace(
              text,
              '    analysis_thread_pool()\n'
              '    result_pool = remote_iqa_thread_pool()\n'
              '    window = MainWindow(\n'
              '        application_settings,\n'
              '        performance_settings,\n'
              '        repository,\n'
              '        iqa_result_pool=result_pool,\n'
              '    )\n'
              '    _compose_main_window_presentation(window)\n',
              '    analysis_thread_pool()\n'
              '    iqa_client = IqaClientInstaller.production()\n'
              '    window = MainWindow(\n'
              '        application_settings,\n'
              '        performance_settings,\n'
              '        repository,\n'
              '        window_contributions=(iqa_client,),\n'
              '    )\n'
              '    _compose_main_window_presentation(window, iqa_client)\n',
              'production explicit client composition',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate patch anchors and commit
        shell: bash
        run: |
          python -m compileall -q src/pixelscope/app/main_window.py src/pixelscope/app/application.py src/pixelscope/app/window_contribution.py src/pixelscope/ui/iqa_client_install.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pixelscope/app/main_window.py src/pixelscope/app/application.py src/pixelscope/app/window_contribution.py src/pixelscope/ui/iqa_client_install.py
          git commit -m "[ChatGPT-assisted] Add Slice 4 IQA composition seam" -m "Co-authored-by: ChatGPT <noreply@openai.com>"
          git push origin HEAD:feat/issue-121-slice-4-iqa-composition-seam
