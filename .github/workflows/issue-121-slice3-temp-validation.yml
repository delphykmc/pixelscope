name: Issue 121 Slice 3 temporary validation

on:
  push:
    branches:
      - feat/issue-121-slice-3-synthetic-iqa

permissions:
  contents: read

jobs:
  synthetic-iqa-canaries:
    runs-on: windows-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/runtime.txt
      - name: Install focused validation dependencies
        run: >-
          python -m pip install -r requirements/runtime.txt
          pytest==7.4.4 pytest-qt==4.4.0 ruff==0.1.15 mypy==1.11.2
      - name: Check Slice 3 lint and formatting
        run: |
          python -m ruff check src/pixelscope/remote/iqa_public_fixture.py src/pixelscope/remote/iqa_explorer.py tests/unit/test_iqa_public_fixture.py tests/unit/test_iqa_public_contract.py tests/ui/test_beta_pass2_iqa_stress.py tests/ui/test_iqa_public_fixture_profiles.py
          python -m ruff format --check src/pixelscope/remote/iqa_public_fixture.py src/pixelscope/remote/iqa_explorer.py tests/unit/test_iqa_public_fixture.py tests/unit/test_iqa_public_contract.py tests/ui/test_beta_pass2_iqa_stress.py tests/ui/test_iqa_public_fixture_profiles.py
      - name: Check source typing
        run: python -m mypy src
      - name: Run Slice 3 public fixture and IQA UI canaries
        run: >-
          python -m pytest -q
          tests/unit/test_iqa_public_fixture.py
          tests/unit/test_iqa_public_contract.py
          tests/unit/test_iqa_explorer.py
          tests/ui/test_beta_pass2_iqa_stress.py
          tests/ui/test_iqa_public_fixture_profiles.py
          tests/ui/test_p5b_iqa_workspace.py
