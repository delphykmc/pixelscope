name: Issue 121 Slice 4 execution bridge

on:
  push:
    branches:
      - feat/issue-121-slice-4-iqa-composition-seam

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-121-slice-4-iqa-composition-seam
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
      - name: Apply execution bridge patch
        run: python .github/issue121_slice4_execution_bridge_patch.py
      - name: Install focused validation environment
        run: |
          python -m pip install -e . pytest==7.4.4 pytest-qt==4.4.0 ruff==0.1.15
          python -m pip check
      - name: Format and lint changed Python
        run: |
          python -m ruff format src/pixelscope/ui/iqa_submission.py src/pixelscope/ui/iqa_client_install.py tests/ui/test_issue121_iqa_composition_seam.py
          python -m ruff check src/pixelscope/ui/iqa_submission.py src/pixelscope/ui/iqa_client_install.py tests/ui/test_issue121_iqa_composition_seam.py
      - name: Run focused execution bridge validation
        run: |
          python -m pytest -q tests/ui/test_issue121_iqa_composition_seam.py tests/ui/test_iqa_public_fixture_profiles.py tests/ui/test_p5c_remote_iqa.py tests/ui/test_p5c_submission_lifecycle.py tests/ui/test_p5b_iqa_workspace.py tests/ui/test_issue81_qt_lifecycle.py tests/unit/test_application_composition.py tests/unit/test_qt_lifecycle_architecture.py tests/unit/test_iqa_public_contract.py tests/unit/test_iqa_public_fixture.py
      - name: Commit execution bridge fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pixelscope/ui/iqa_submission.py src/pixelscope/ui/iqa_client_install.py tests/ui/test_issue121_iqa_composition_seam.py
          git commit -m "[ChatGPT-assisted] Complete public IQA execution bridge" -m "Co-authored-by: ChatGPT <noreply@openai.com>"
          git push origin HEAD:feat/issue-121-slice-4-iqa-composition-seam
