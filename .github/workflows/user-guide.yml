      - "tests/unit/test_user_guide_agent_search.py"
      - "tests/unit/test_user_guide_packaging.py"
      - ".github/pull_request_template.md"
      - ".github/workflows/user-guide.yml"

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  build:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/docs.txt
      # Preserve automatic standalone-branch validation. Skip duplicate push
      # work ONLY if GitHub confirms a real matching same-SHA PR docs run.
      # The PR run itself is NEVER skipped or cancelled; API/race fails open.
      - name: Detect equivalent PR run before expensive push validation
        id: duplicate_push
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/skip_duplicate_user_guide_push.py
          --repo "${{ github.repository }}"
          --branch "${{ github.ref_name }}"
          --sha "${{ github.sha }}"
      - name: Install documentation validation dependencies
        if: steps.duplicate_push.outputs.skip != 'true'
        run: >-
          python -m pip install -r requirements/docs.txt
          pytest==7.4.4 ruff==0.1.15 Pillow==12.3.0
      - name: Install application for Windows release-artifact regression tests
        if: runner.os == 'Windows' && steps.duplicate_push.outputs.skip != 'true'
        run: python -m pip install -e .
      - name: Install pinned Qt UI test harness on Windows
        if: runner.os == 'Windows' && steps.duplicate_push.outputs.skip != 'true'
        run: python -m pip install pytest-qt==4.2.0
      - name: Validate E7 local and context Help UI on Windows
        if: runner.os == 'Windows' && steps.duplicate_push.outputs.skip != 'true'
        run: python -m pytest -q tests/ui/test_user_guide_help.py
      - name: Check installed documentation environment
        if: steps.duplicate_push.outputs.skip != 'true'
        run: python -m pip check
      - name: Check documentation contract
        if: steps.duplicate_push.outputs.skip != 'true'
        run: python scripts/check_docs.py
      - name: Run documentation contract tests
        if: steps.duplicate_push.outputs.skip != 'true'
        run: >-
          python -m pytest -q
          tests/unit/test_docs_contract.py
          tests/unit/test_screenshot_manifest_contract.py
          tests/unit/test_user_guide_screenshot_rendering.py
          tests/unit/test_ui_screenshot_coverage_audit.py
          tests/unit/test_ui_screenshot_impact.py
          tests/unit/test_ui_screenshot_diff.py
          tests/unit/test_ui_screenshot_preflight.py
          tests/unit/test_user_guide_ci_dedupe.py
          tests/unit/test_ui_screenshot_capture_packet.py
          tests/unit/test_ui_screenshot_git_history.py
          tests/unit/test_user_guide_site_contract.py
          tests/unit/test_user_guide_packaging.py
          tests/unit/test_user_guide_publication.py
          tests/unit/test_user_guide_publication_ref.py
          tests/unit/test_user_guide_agent_search.py
      - name: Check E6 coverage decisions without fabricating completion
        if: steps.duplicate_push.outputs.skip != 'true'
        run: python scripts/audit_ui_screenshot_coverage.py
      - name: Audit approved screenshot image blobs and historical commits
        if: steps.duplicate_push.outputs.skip != 'true'
        run: python scripts/audit_ui_screenshot_git_history.py
      - name: Validate E3 impact selection for pinned PR base and head
        if: github.event_name == 'pull_request' && steps.duplicate_push.outputs.skip != 'true'
        run: >-
          python scripts/select_ui_screenshots.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: Run release-artifact regressions on Windows
        if: runner.os == 'Windows' && steps.duplicate_push.outputs.skip != 'true'
        run: python -m pytest -q tests/unit/test_release_packaging.py tests/unit/test_release_candidate.py
      - name: Check whole-repository Ruff lint and formatting
        if: steps.duplicate_push.outputs.skip != 'true'
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Install pinned mypy for full source validation
        if: runner.os == 'Windows' && steps.duplicate_push.outputs.skip != 'true'
        run: python -m pip install mypy==1.8.0
      - name: Type-check entire src with mypy
        if: runner.os == 'Windows' && steps.duplicate_push.outputs.skip != 'true'
        run: python -m mypy src
      - name: Check branch diff for whitespace errors
        if: steps.duplicate_push.outputs.skip != 'true'
        run: |
          git fetch origin main:refs/remotes/origin/main
          git diff --check origin/main...HEAD
      - name: Build from checked-in files with outbound sockets blocked
        if: steps.duplicate_push.outputs.skip != 'true'
        run: python scripts/check_user_guide_build_offline.py
      - name: Validate generated offline artifact
        if: steps.duplicate_push.outputs.skip != 'true'
        run: python scripts/check_user_guide_site.py site
