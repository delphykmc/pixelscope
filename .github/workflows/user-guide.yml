name: User Guide validation

on:
  push:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements/docs.txt"
      - "scripts/check_docs.py"
      - "scripts/check_user_guide_site.py"
      - "scripts/build_user_guide.py"
      - "scripts/check_user_guide_build_offline.py"
      - "scripts/prepare_user_guide_publication.py"
      - ".github/workflows/user-guide-publication.yml"
      - "scripts/build_release.py"
      - "scripts/validate_release_artifact.py"
      - "tests/unit/test_release_packaging.py"
      - "tests/unit/test_docs_contract.py"
      - "tests/unit/test_user_guide_site_contract.py"
      - "tests/unit/test_user_guide_publication.py"
      - "tests/unit/test_user_guide_packaging.py"
      - ".github/pull_request_template.md"
      - ".github/workflows/user-guide.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements/docs.txt"
      - "scripts/check_docs.py"
      - "scripts/check_user_guide_site.py"
      - "scripts/build_user_guide.py"
      - "scripts/check_user_guide_build_offline.py"
      - "scripts/prepare_user_guide_publication.py"
      - ".github/workflows/user-guide-publication.yml"
      - "scripts/build_release.py"
      - "scripts/validate_release_artifact.py"
      - "tests/unit/test_release_packaging.py"
      - "tests/unit/test_docs_contract.py"
      - "tests/unit/test_user_guide_site_contract.py"
      - "tests/unit/test_user_guide_publication.py"
      - ".github/pull_request_template.md"
      - ".github/workflows/user-guide.yml"

permissions:
  contents: read

jobs:
  build:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/docs.txt
      - name: Install documentation validation dependencies
        run: >-
          python -m pip install -r requirements/docs.txt
          pytest==7.4.4 ruff==0.1.15
      - name: Check installed documentation environment
        run: python -m pip check
      - name: Check documentation contract
        run: python scripts/check_docs.py
      - name: Run documentation contract tests
        run: >-
          python -m pytest -q
          tests/unit/test_docs_contract.py
          tests/unit/test_user_guide_site_contract.py
          tests/unit/test_user_guide_packaging.py
          tests/unit/test_user_guide_publication.py
      - name: Check documentation checker style
        run: |
          python -m ruff check scripts/check_docs.py scripts/check_user_guide_site.py scripts/build_user_guide.py scripts/check_user_guide_build_offline.py scripts/prepare_user_guide_publication.py tests/unit/test_docs_contract.py tests/unit/test_user_guide_site_contract.py tests/unit/test_user_guide_packaging.py tests/unit/test_user_guide_publication.py
          python -m ruff format --check scripts/check_docs.py scripts/check_user_guide_site.py scripts/build_user_guide.py scripts/check_user_guide_build_offline.py scripts/prepare_user_guide_publication.py tests/unit/test_docs_contract.py tests/unit/test_user_guide_site_contract.py tests/unit/test_user_guide_packaging.py tests/unit/test_user_guide_publication.py
      - name: Check branch diff for whitespace errors
        run: |
          git fetch origin main:refs/remotes/origin/main
          git diff --check origin/main...HEAD
      - name: Build from checked-in files with outbound sockets blocked
        run: python scripts/check_user_guide_build_offline.py
      - name: Validate generated offline artifact
        run: python scripts/check_user_guide_site.py site
