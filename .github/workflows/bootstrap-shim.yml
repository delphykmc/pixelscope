name: Temporary upstream shim bootstrap
on:
  push:
    paths:
      - ".github/workflows/bootstrap-shim.yml"
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - name: Capture upstream MIT JavaScript payload and digest
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import urllib.request
          url = "https://unpkg.com/iframe-worker@1.0.4/shim/index.js"
          with urllib.request.urlopen(url, timeout=20) as response:
              payload = response.read()
          print("SHIM_SHA256=" + hashlib.sha256(payload).hexdigest())
          print("SHIM_BASE64_START")
          print(base64.b64encode(payload).decode("ascii"))
          print("SHIM_BASE64_END")
          PY
