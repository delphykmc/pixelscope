name: Focused validation

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "examples/**"
      - "packaging/**"
      - "requirements/**"
      - "pyproject.toml"
      - "mkdocs.yml"
      - ".github/workflows/validation.yml"
      - ".github/workflows/user-guide-publication.yml"
      - ".github/workflows/ui-screenshot-diff.yml"
      - ".github/pull_request_template.md"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "examples/**"
      - "packaging/**"
      - "requirements/**"
      - "pyproject.toml"
      - "mkdocs.yml"
      - ".github/workflows/validation.yml"
      - ".github/workflows/user-guide-publication.yml"
      - ".github/workflows/ui-screenshot-diff.yml"
      - ".github/pull_request_template.md"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: focused-validation-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify validation scope
    runs-on: ubuntu-latest
    outputs:
      skip_push: ${{ steps.duplicate_push.outputs.skip }}
      docs: ${{ steps.scope.outputs.docs }}
      docs_core: ${{ steps.scope.outputs.docs_core }}
      screenshots: ${{ steps.scope.outputs.screenshots }}
      publication: ${{ steps.scope.outputs.publication }}
      ci_policy: ${{ steps.scope.outputs.ci_policy }}
      help_ui: ${{ steps.scope.outputs.help_ui }}
      release: ${{ steps.scope.outputs.release }}
      raw: ${{ steps.scope.outputs.raw }}
      yuv: ${{ steps.scope.outputs.yuv }}
      static: ${{ steps.scope.outputs.static }}
      static_config_changed: ${{ steps.scope.outputs.static_config_changed }}
      src_changed: ${{ steps.scope.outputs.src_changed }}
      typecheck: ${{ steps.scope.outputs.typecheck }}
      windows_native: ${{ steps.scope.outputs.windows_native }}
      any_validation: ${{ steps.scope.outputs.any_validation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check PR run and merge-tree identity before duplicate push validation
        id: duplicate_push
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/skip_duplicate_validation_push.py
          --repo "${{ github.repository }}"
          --branch "${{ github.ref_name }}"
          --sha "${{ github.sha }}"
      - name: Classify changed paths
        id: scope
        if: steps.duplicate_push.outputs.skip != 'true'
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          python scripts/classify_ci_changes.py --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA" --output build/ci-classification.json --github-output "$GITHUB_OUTPUT"

  ubuntu:
    name: Validate on ubuntu-latest
    needs: classify
    if: needs.classify.outputs.skip_push != 'true' && needs.classify.outputs.any_validation == 'true'
    runs-on: ubuntu-latest
    env:
      CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements/docs.txt
            requirements/runtime.txt
            pyproject.toml
      - name: Install cheap validation tools
        run: python -m pip install pytest==7.4.4 ruff==0.1.15
      - name: Validate CI policy contracts
        run: >-
          python -m pytest -q
          tests/unit/test_ci_change_classification.py
          tests/unit/test_ci_workflow_policy.py
          tests/unit/test_ci_test_groups.py
          tests/unit/test_validation_ci_dedupe.py
      - name: Install type-check environment
        if: needs.classify.outputs.typecheck == 'true'
        run: python -m pip install -r requirements/runtime.txt mypy==1.8.0
      - name: Type-check source
        if: needs.classify.outputs.typecheck == 'true'
        run: python -m mypy src
      - name: Install documentation validation dependencies
        if: needs.classify.outputs.docs == 'true'
        run: python -m pip install -r requirements/docs.txt Pillow==12.3.0
      - name: Check installed documentation environment
        if: needs.classify.outputs.docs == 'true'
        run: python -m pip check
      - name: Check documentation contract
        if: needs.classify.outputs.docs == 'true'
        run: python scripts/check_docs.py
      - name: Run core documentation contracts
        if: needs.classify.outputs.docs_core == 'true'
        run: >-
          python -m pytest -q
          tests/unit/test_docs_contract.py
          tests/unit/test_user_guide_site_contract.py
          tests/unit/test_user_guide_agent_search.py
      - name: Run screenshot lifecycle contracts
        if: needs.classify.outputs.screenshots == 'true'
        run: >-
          python -m pytest -q
          tests/unit/test_screenshot_manifest_contract.py
          tests/unit/test_user_guide_screenshot_rendering.py
          tests/unit/test_ui_screenshot_coverage_audit.py
          tests/unit/test_ui_screenshot_impact.py
          tests/unit/test_ui_screenshot_diff.py
          tests/unit/test_ui_screenshot_preflight.py
          tests/unit/test_ui_screenshot_capture_packet.py
          tests/unit/test_ui_screenshot_git_history.py
      - name: Run publication and packaging contracts
        if: needs.classify.outputs.publication == 'true'
        run: >-
          python -m pytest -q
          tests/unit/test_user_guide_packaging.py
          tests/unit/test_user_guide_publication.py
          tests/unit/test_user_guide_publication_ref.py
      - name: Check screenshot coverage decisions
        if: needs.classify.outputs.screenshots == 'true'
        run: python scripts/audit_ui_screenshot_coverage.py
      - name: Audit approved screenshot image blobs and historical commits
        if: needs.classify.outputs.screenshots == 'true'
        run: python scripts/audit_ui_screenshot_git_history.py
      - name: Validate screenshot impact selection for pinned PR base and head
        if: github.event_name == 'pull_request' && needs.classify.outputs.screenshots == 'true'
        run: >-
          python scripts/select_ui_screenshots.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: Check whole-repository Ruff lint and formatting
        if: needs.classify.outputs.static == 'true'
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Check branch diff for whitespace errors
        run: git diff --check "$CI_BASE_SHA...$CI_HEAD_SHA"
      - name: Build User Guide offline
        if: needs.classify.outputs.docs == 'true'
        run: python scripts/check_user_guide_build_offline.py
      - name: Validate generated offline User Guide
        if: needs.classify.outputs.docs == 'true'
        run: python scripts/check_user_guide_site.py site

  windows:
    name: Validate on windows-2022
    needs: classify
    if: needs.classify.outputs.skip_push != 'true' && needs.classify.outputs.windows_native == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements/runtime.txt
            pyproject.toml
      - name: Install application and focused Windows validation tools
        run: |
          python -m pip install -e .
          python -m pip install pytest==7.4.4 pytest-qt==4.2.0
          python -m pip check
      - name: Run durable Help contracts
        if: needs.classify.outputs.help_ui == 'true'
        run: python scripts/ci_test_groups.py help
      - name: Run durable release contracts
        if: needs.classify.outputs.release == 'true'
        run: python scripts/ci_test_groups.py release
      - name: Run durable RAW contracts
        if: needs.classify.outputs.raw == 'true'
        run: python scripts/ci_test_groups.py raw
      - name: Run durable YUV contracts
        if: needs.classify.outputs.yuv == 'true'
        run: python scripts/ci_test_groups.py yuv
