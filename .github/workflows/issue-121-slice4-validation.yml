name: Issue 121 Slice 4 focused validation

on:
  push:
    branches:
      - feat/issue-121-slice-4-iqa-composition-seam

permissions:
  contents: read

jobs:
  focused-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install validation environment
        run: |
          python -m pip install -r requirements/dev.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Check Slice 4 formatting and lint
        run: |
          python -m ruff check src/pixelscope/app/application.py src/pixelscope/app/main_window.py src/pixelscope/app/window_contribution.py src/pixelscope/ui/iqa_client_install.py tests/ui/test_issue121_iqa_composition_seam.py
          python -m ruff format --check src/pixelscope/app/application.py src/pixelscope/app/main_window.py src/pixelscope/app/window_contribution.py src/pixelscope/ui/iqa_client_install.py tests/ui/test_issue121_iqa_composition_seam.py
      - name: Run Slice 4 composition and lifecycle canaries
        run: >-
          python -m pytest -q
          tests/ui/test_issue121_iqa_composition_seam.py
          tests/ui/test_p5c_remote_iqa.py::test_production_composition_extends_exactly_one_existing_iqa_dock
          tests/ui/test_p5e_file_menu_order.py
          tests/ui/test_p5f_worker_isolation.py::test_production_composition_binds_only_result_side_work_to_remote_iqa_pool
          tests/ui/test_issue81_qt_lifecycle.py::test_running_iqa_loader_can_finish_after_window_destruction_without_cross_thread_qobject_delete
          tests/ui/test_issue81_qt_lifecycle.py::test_production_composition_disposes_image_viewer_graphics_before_deferred_delete
