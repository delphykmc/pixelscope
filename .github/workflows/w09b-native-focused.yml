name: W09b temporary native decoder acceptance

on:
  push:
    branches: [codex/w09b-named-finding-native-restore-20261105]
  workflow_dispatch:

jobs:
  native-verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install native test dependencies
        run: python -m pip install -r requirements/runtime.txt pytest==7.4.4
      - name: Run native verification and W09a regression
        run: >-
          python -m pytest -q
          tests/unit/test_w09b_native_decoder.py
          tests/unit/test_w09a_review_repository.py
