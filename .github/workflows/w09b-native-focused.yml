name: W09b temporary native decoder acceptance

on:
  push:
    branches: [codex/w09b-named-finding-native-restore-20261105]
  workflow_dispatch:

jobs:
  native-verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Linux Qt runtime libraries
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1
      - name: Install native test dependencies
        run: python -m pip install -r requirements/runtime.txt pytest==7.4.4 ruff==0.1.15
      - name: Enforce Ruff quality gates
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m ruff check --fix --diff . || true
          python -m ruff format --diff . || true
          python -m ruff check .
          python -m ruff format --check .
      - name: Run native verification and W09a regression
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q
          tests/unit/test_w09b_native_decoder.py
          tests/unit/test_w09b_review_workflow.py
          tests/unit/test_w09b_review_guards.py
          tests/unit/test_w09a_review_repository.py
