name: Windows Release CI

on:
  pull_request:
    paths:
      - ".github/workflows/windows-release-ci.yml"
      - "packaging/**"
      - "requirements/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "docs/PACKAGING_CONSTRAINTS.md"
      - "docs/exec-plans/active/p7-*.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-release-ci.yml"
      - "packaging/**"
      - "requirements/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "docs/PACKAGING_CONSTRAINTS.md"
      - "docs/exec-plans/active/p7-*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10.11"
  INNO_VERSION: "6.2.1"
  INNO_SHA256: "50D21AAB83579245F88E2632A61B943AD47557E42B0F02E6CE2AFEF4CDD8DEB1"
  PYTHONPATH: ${{ github.workspace }}\src

jobs:
  build-validate-retain:
    name: Build, smoke, and retain Windows x64 artifacts
    runs-on: windows-2022
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pinned CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Verify hosted Python contract
        shell: pwsh
        run: |
          python -c "import platform, struct, sys; assert sys.version_info[:3] == (3, 10, 11), sys.version; assert struct.calcsize('P') * 8 == 64; assert platform.system() == 'Windows'"

      - name: Create isolated validation environments
        shell: pwsh
        run: |
          python -m venv .venv
          python -m venv .venv-release
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements\dev.txt
          .\.venv-release\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements\release.txt

      - name: Validate source and repository contracts
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe scripts\check_docs.py
          .\.venv\Scripts\python.exe -m pytest -q tests\unit\test_release_ci.py tests\unit\test_release_distribution.py
          .\.venv\Scripts\python.exe -m pytest -q
          .\.venv\Scripts\python.exe -m ruff check .
          .\.venv\Scripts\python.exe -m mypy src
          .\.venv\Scripts\python.exe -m pip check
          git diff --check

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION.exe"
          $url = "https://files.jrsoftware.org/is/6/innosetup-$env:INNO_VERSION.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualHash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualHash -ne $env:INNO_SHA256) {
            throw "Inno Setup SHA-256 mismatch: $actualHash"
          }
          $process = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installer exited with code $($process.ExitCode)"
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found after Inno Setup installation: $iscc"
          }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and smoke canonical PyInstaller payload
        shell: pwsh
        run: |
          .\.venv-release\Scripts\python.exe scripts\build_release.py
          .\.venv-release\Scripts\python.exe scripts\validate_release_artifact.py
          .\.venv-release\Scripts\python.exe scripts\smoke_packaged_release.py

      - name: Build and smoke portable distribution
        shell: pwsh
        run: |
          .\.venv-release\Scripts\python.exe scripts\build_portable_release.py
          .\.venv-release\Scripts\python.exe scripts\smoke_portable_release.py

      - name: Build and smoke installer distribution
        shell: pwsh
        run: |
          .\.venv-release\Scripts\python.exe scripts\build_installer_release.py
          .\.venv-release\Scripts\python.exe scripts\smoke_installer_release.py

      - name: Validate retained production bundle
        id: release-version
        shell: pwsh
        run: |
          .\.venv-release\Scripts\python.exe scripts\validate_ci_release_bundle.py
          $version = .\.venv-release\Scripts\python.exe -c "from scripts.release_contract import release_version; print(release_version())"
          if (-not $version) {
            throw "Unable to resolve release version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload validated Windows distribution bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PixelScope-${{ steps.release-version.outputs.version }}-windows-x64-ci
          path: |
            release/PixelScope-${{ steps.release-version.outputs.version }}-windows-x64.manifest.json
            release/PixelScope-${{ steps.release-version.outputs.version }}-windows-x64-THIRD_PARTY_NOTICES.txt
            release/PixelScope-${{ steps.release-version.outputs.version }}-windows-x64-portable.zip
            release/PixelScope-${{ steps.release-version.outputs.version }}-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
