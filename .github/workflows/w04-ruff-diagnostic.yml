name: W04 Ruff diagnostic (read-only)
on:
  push:
    branches:
      - codex/w04-ruff-diagnostic-20261104
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Inspect exact Ruff 0.1.15 autofix diff without editing
        run: |
          python -m pip install ruff==0.1.15
          python -m ruff check --select I --fix --diff src/pixelscope/ui/review_view_state_adapter.py tests/unit/test_review_view_state.py || true
          python -m ruff format --check src/pixelscope/ui/review_view_state_adapter.py tests/unit/test_review_view_state.py || true
