name: W04 Ruff diagnostic (read-only)
on:
  push:
    branches:
      - codex/w04-ruff-diagnostic-20261104
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Inspect exact Ruff 0.1.15 autofix diff without editing
        run: |
          python -m pip install ruff==0.1.15
          python -m ruff check --select I --fix --diff src/pixelscope/ui/review_view_state_adapter.py tests/unit/test_review_view_state.py || true
          python -m ruff format --diff src/pixelscope/ui/review_view_state_adapter.py tests/unit/test_review_view_state.py || true
  focused-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 105a07e6021cc832241bb4ad49043dffef2e660b
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install required Qt shared libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1
      - name: Install pinned UI test environment
        run: |
          python -m pip install -r requirements/runtime.txt
          python -m pip install pytest==7.4.4 pytest-qt==4.2.0
      - name: Verify checkout and run W04 focused tests
        run: |
          git rev-parse HEAD
          python -c "import pixelscope; print(pixelscope.__file__)"
          python -m pytest -q tests/unit/test_review_view_state.py tests/unit/test_physical_zoom.py
          python -m pytest -q tests/ui/test_w04_review_view_state.py tests/ui/test_w01_physical_zoom.py
          python -m pytest -q tests/ui/test_issue75_viewer_coordinates.py tests/ui/test_ui_workspace_contracts.py tests/ui/test_plot_statistics_contracts.py tests/ui/test_difference_workspace_contracts.py tests/ui/test_p4c_session_restore.py
