name: W08b temporary Windows native smoke

on:
  pull_request:
    paths:
      - "src/pixelscope/**"
      - "tests/**"
      - ".github/workflows/w08b-windows-native-smoke.yml"

permissions:
  contents: read

jobs:
  windows-native-smoke:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: x64
      - name: Install pinned app and test dependencies
        run: |
          python -m pip install -r requirements/dev.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Focused W08b and W08a/RAW/YUV native regression smoke
        run: |
          python -m pytest -q tests/unit/test_w08b_input_profile_batch.py tests/ui/test_w08b_batch_preview.py tests/ui/test_w08_input_profile_library.py tests/ui/test_wp_b_raw_binary_compatibility.py tests/unit/test_raw_reader.py tests/unit/test_yuv_runtime_contracts.py
